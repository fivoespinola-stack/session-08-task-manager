<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Interactive Task Manager</title> 
  <link rel="stylesheet" href="./css/style.css"> 
</head> 
<body> 
 
  <main class="app"> 
    <header class="app-header"> 
      <h1>Task Manager</h1> 
      <p>Add, complete, and manage your tasks.</p> 
    </header> 
 
    <form id="taskForm"> 
      <label for="taskInput">Task Title</label> 
      <div class="form-row"> 
        <input 
          id="taskInput" 
          type="text" 
          placeholder="Enter a task" 
          required 
        > 
        <button type="submit">Add Task</button> 
      </div> 
    </form> 
 
    <p id="message" aria-live="polite"></p> 

    <select id="taskFilter">
      <option value="all">All tasks</option>
      <option value="active">Active tasks</option>
      <option value="completed">Completed tasks</option>
    </select>
 
    <section class="task-section"> 
      <h2>My Tasks</h2> 
      <p id="taskSummary" aria-live="polite"></p>
      <button id="clearCompletedBtn" type="button">Clear completed</button>
      <ul id="taskList"></ul> 
    </section> 
  </main> 
 
  <script src="./js/app.js"></script> 
</body> 
</html>
